<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients for depth -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0039a6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background circle (subtle) -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#e8eef7" stroke-width="1"/>

  <!-- Main geometric shape: stylized checkmark + list -->
  <g filter="url(#shadow)">
    <!-- Left vertical line (list indicator) -->
    <rect x="40" y="50" width="8" height="100" rx="4" fill="url(#blueGrad)"/>

    <!-- Dynamic checkmark path on the right -->
    <path d="M 85 110 L 105 130 L 155 70"
          stroke="url(#blueGrad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- Accent dots showing progression -->
  <circle cx="125" cy="65" r="5" fill="#0052cc" opacity="0.6"/>
  <circle cx="135" cy="80" r="5" fill="#0052cc" opacity="0.4"/>
</svg>